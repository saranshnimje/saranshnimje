name: Generate ASCII Portrait

on:
  push:
    paths:
      - 'source/**'
      - 'scripts/prep_photo.py'
      - 'scripts/make_ascii_svg.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate portrait SVG
        run: |
          python scripts/prep_photo.py source/source-photo.png source/processed-photo.png 100
          python scripts/make_ascii_svg.py source/processed-photo.png assets/ascii/portrait.svg assets/ascii/portrait-static.svg 100

      - name: Commit generated portrait
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ascii/portrait.svg assets/ascii/portrait-static.svg
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'chore: regenerate ASCII portrait from source photo'
            git push
          fi
