<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="128" viewBox="0 0 700 128" xmlns="http://www.w3.org/2000/svg">
  <title>Projects for Saransh Nimje</title>
  <desc>Terminal-style card showing projects and their descriptions</desc>
  
  <!-- Background -->
  <rect width="700" height="128" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  
  <!-- Content -->
  <g font-family="'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace" font-size="14">
    <text x="40" y="70" fill="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.00s" fill="freeze"/>
      saranshnimje@github:~$ ls ./projects
    </text>
    <text x="40" y="94" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.03s" fill="freeze"/>
      
    </text>
  </g>
</svg>