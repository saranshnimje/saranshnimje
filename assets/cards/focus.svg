    </text>
    <text x="40" y="94" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.05s" fill="freeze"/>
      
    </text>
    <text x="40" y="118" fill="#f0f6fc" opacity="0">
