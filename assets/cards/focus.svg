    </text>
    <text x="40" y="214" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.30s" fill="freeze"/>
      → RAG
    </text>
    <text x="40" y="238" fill="#c9d1d9" opacity="0">
