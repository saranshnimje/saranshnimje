<?xml version="1.0" encoding="UTF-8"?>
<svg width="572" height="392" viewBox="0 0 572 392" xmlns="http://www.w3.org/2000/svg">
  <title>Current focus areas for Saransh Nimje</title>
  <desc>Terminal-style card showing current learning and exploration areas</desc>
  
  <!-- Background -->
  <rect width="572" height="392" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  
  <!-- Content -->
  <g font-family="'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace" font-size="14">
    <text x="40" y="70" fill="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.00s" fill="freeze"/>
