<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="160" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
  <title>Terminal header for Saransh Nimje</title>
  <desc>Animated terminal-style header showing profile initialization</desc>
  
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="160" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  
  <!-- Title bar -->
  <text x="250" y="22" text-anchor="middle" font-family="'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace" font-size="11" fill="#8b949e">
    saransh@github
  </text>
  
  <!-- Border line -->
  <line x1="10" y1="35" x2="490" y2="35" stroke="#30363d" stroke-width="1"/>
  
  <!-- Content -->
  <g font-family="'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace" font-size="14">
    <!-- Command line 1 -->
    <text x="15" y="60" fill="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze"/>
      saransh@github:~$ ./profile.sh
    </text>
    
    <!-- Command line 2 -->
    <text x="15" y="85" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.8s" fill="freeze"/>
      initializing developer profile...
    </text>
    
    <!-- Command line 3 -->
    <text x="15" y="110" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/>
      loading modules: [ ai ] [ web ] [ systems ]
    </text>
    
    <!-- Status line -->
    <text x="15" y="135" fill="#39d353" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.0s" fill="freeze"/>
      status: ONLINE
    </text>
    
    <!-- Blinking cursor -->
    <text x="85" y="135" fill="#39d353" class="cursor">_</text>
  </g>
</svg>